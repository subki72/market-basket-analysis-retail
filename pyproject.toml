[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "market-basket-analysis-retail"
version = "1.0.0"
description = "Modular Market Basket Analysis (Apriori) pipeline, CLI, and FastAPI microservice."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["*.ipynb", ".venv", "venv", "env", "mba_project"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.isort]
force-sort-within-sections = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]
