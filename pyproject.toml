[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "market-basket-analysis-retail"
version = "1.0.0"
description = "Modular Market Basket Analysis (Apriori) pipeline, CLI, and FastAPI microservice."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas==2.2.3",
    "numpy==2.1.3",
    "mlxtend==0.23.3",
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "pydantic==2.10.4",
    "httpx==0.28.1",
    "python-dotenv==1.0.1",
    "matplotlib==3.9.2",
    "seaborn==0.13.2",
    "pytest==8.3.4",
    "pytest-cov==6.3.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["*.ipynb", ".venv", "venv", "env", "mba_project"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.isort]
force-sort-within-sections = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]
